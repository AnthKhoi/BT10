spring.application.name=JWT_springboot3
server.port=8005

# ===================================================================
# CAU HINH DATABASE:
# 1. Mac dinh su dung H2 in-memory Database de chay ngay lap tuc ma khong can cai dat MySQL
# ===================================================================
spring.datasource.url=jdbc:h2:mem:jwt_springboot3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console: http://localhost:8005/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# 2. Neu ban muon su dung MySQL (nhu trong Slide 21), bo comment cac dong sau:
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=1234567@a$

## Hibernate properties (Slide 21)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ===================================================================
# JWT Configuration (Slide 21)
# ===================================================================
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000
